name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Run test unitaire
        run: npm test
      - name: Run test lint
        run: npm run lint